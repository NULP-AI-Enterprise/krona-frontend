server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Backend API paths -- proxied to krona-backend over the cluster's
    # internal service network (ClusterIP DNS), never through the public
    # ingress. Matched with a trailing slash so they don't shadow the
    # identically-named SPA routes (e.g. /concordance vs backend /concordance/).
    location ~ ^/(api|admin|chaining|concordance|word-list|metadata-options|corpus|text|filtered-subcorpus|user-subcorpus|subcorpora|shares|corpus-shares)/ {
        proxy_pass http://krona-backend.krona.svc.cluster.local:8000;
        # Backend's ALLOWED_HOSTS only permits krona-api.thesis-i.com --
        # forwarding the frontend's own Host here would trip DisallowedHost.
        proxy_set_header Host krona-api.thesis-i.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme: this hop is always plain HTTP (nginx has no
        # TLS listener of its own) even though the public site is https-only.
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
